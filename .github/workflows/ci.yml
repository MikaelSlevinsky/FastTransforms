name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: C - ${{ matrix.os }} - ${{ matrix.compiler }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-latest
        compiler:
          - gcc
          - clang
        arch:
          - x86
          - x64
          - aarch64
        exclude:
          - os: macos-15-intel
            arch: x86
          - os: macos-15-intel
            arch: aarch64
          - os: macos-latest
            arch: x86
          - os: macos-latest
            arch: x64
      fail-fast: false
    env:
      CC: ${{ matrix.compiler }}
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:.
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies on ubuntu gcc
        if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.compiler, 'gcc')
        run: |
          sudo apt-get update
          sudo apt-get install libblas-dev libopenblas-dev libfftw3-dev libmpfr-dev
      - name: Install dependencies on ubuntu clang
        if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.compiler, 'clang')
        run: |
          sudo apt-get update
          sudo apt-get install libomp-dev libblas-dev libopenblas-dev libfftw3-dev libmpfr-dev
      # Homebrew no longer ships Intel macOS bottles for these, so it would
      # build them (and gcc) from source; conda-forge has osx-64 and osx-arm64 builds.
      - name: Set up conda on macOS
        if: startsWith(matrix.os, 'macos')
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ft
      - name: Install dependencies on macOS
        if: startsWith(matrix.os, 'macos')
        shell: bash -el {0}
        run: |
          conda install -y openblas libblas fftw mpfr llvm-openmp
          echo "FT_PREFIX=$CONDA_PREFIX" >> $GITHUB_ENV
          echo "LDFLAGS=-Wl,-rpath,$CONDA_PREFIX/lib" >> $GITHUB_ENV
      - name: Compiler version
        run: ${CC} --version
      - name: Configure environment for quadmath
        if: startsWith(matrix.os, 'ubuntu') && startsWith(matrix.compiler, 'gcc')
        run: echo "FT_QUADMATH=1" >> $GITHUB_ENV
      - name: Build assembly
        run: make assembly
      - name: Build library
        run: make lib
      - name: Build tests
        run: make tests
      - name: Build examples
        run: make examples
      - name: Run tests
        run: make runtests FT_NUM_THREADS=2
      - name: Run examples
        run: make runexamples
  docs:
    name: Documentation
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: brew install doxygen
      - name: Build site
        run: doxygen Doxyfile
      - if: ${{ github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/html
          force_orphan: true
